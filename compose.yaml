services:
  app:
    build:
      context: .
      target: app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    stdin_open: true
    tty: true

  precommit:
    build:
      context: .
      target: precommit
    volumes:
      - .:/app
      - precommit_cache:/root/.cache

  web:
    profiles: [production]
    build:
      context: .
      target: production
    ports:
      - "8080:80"

volumes:
  node_modules:
  precommit_cache:
